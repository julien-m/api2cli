name: Auto Release

on:
  push:
    branches:
      - main
    paths:
      - "packages/cli/**"

env:
  BUN_VERSION: "1.3.9"

jobs:
  release:
    if: "!startsWith(github.event.head_commit.message, 'chore: release')"
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
          persist-credentials: true

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git

      - name: Check for changes since last tag
        id: changes
        run: |
          LAST_TAG=$(git tag -l 'v*' --sort=-v:refname | head -1)
          echo "Last tag: $LAST_TAG"
          if [ -z "$LAST_TAG" ]; then
            echo "has_changes=true" >> $GITHUB_OUTPUT
          else
            CHANGED_FILES=$(git diff --name-only $LAST_TAG HEAD -- packages/cli/ ':!packages/cli/package.json')
            echo "Changed files since $LAST_TAG:"
            echo "$CHANGED_FILES"
            if [ -n "$CHANGED_FILES" ]; then
              echo "has_changes=true" >> $GITHUB_OUTPUT
            else
              echo "has_changes=false" >> $GITHUB_OUTPUT
            fi
          fi

      - name: Check npm publish eligibility
        id: npm_publish
        if: steps.changes.outputs.has_changes == 'true'
        working-directory: packages/cli
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail

          PACKAGE_NAME=$(node -p "require('./package.json').name")
          CURRENT_VERSION=$(node -p "require('./package.json').version")
          NEXT_VERSION=$(node -e "const parts = require('./package.json').version.split('.').map(Number); parts[2] += 1; console.log(parts.join('.'));")

          {
            echo "package_name=$PACKAGE_NAME"
            echo "current_version=$CURRENT_VERSION"
            echo "next_version=$NEXT_VERSION"
          } >> "$GITHUB_OUTPUT"

          if ! NPM_USER=$(npm whoami 2>/dev/null); then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "reason=npm token is missing or invalid" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if npm view "${PACKAGE_NAME}@${NEXT_VERSION}" version >/dev/null 2>&1; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "reason=${PACKAGE_NAME}@${NEXT_VERSION} already exists on npm" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          MAINTAINERS_JSON=$(npm view "$PACKAGE_NAME" maintainers --json 2>/dev/null || echo "[]")
          if ! MAINTAINERS_JSON="$MAINTAINERS_JSON" node -e '
            const maintainers = JSON.parse(process.env.MAINTAINERS_JSON || "[]");
            const npmUser = process.argv[1];
            const allowed = Array.isArray(maintainers) && maintainers.some((maintainer) => {
              if (typeof maintainer === "string") return maintainer.split(/\s+/)[0] === npmUser;
              return maintainer?.name === npmUser;
            });
            process.exit(allowed ? 0 : 1);
          ' "$NPM_USER"; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "reason=${NPM_USER} is not a maintainer of ${PACKAGE_NAME}" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "enabled=true" >> "$GITHUB_OUTPUT"

      - name: Skip release
        if: steps.changes.outputs.has_changes == 'true' && steps.npm_publish.outputs.enabled != 'true'
        run: |
          echo "Skipping npm release: ${{ steps.npm_publish.outputs.reason }}"

      - name: Release
        if: steps.changes.outputs.has_changes == 'true' && steps.npm_publish.outputs.enabled == 'true'
        working-directory: packages/cli
        run: bun run release -- patch --ci
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
